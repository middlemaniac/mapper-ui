<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#f4f5f1">
  <title>MM mapper</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="index.css" rel="stylesheet">
  <script type="module" src="index.js"></script>
</head>
<body class="bg-body-tertiary">
  <input id="level-schema-file" type="file" accept=".json,.xml,.xsd,application/json,application/xml,text/xml" hidden>
  <input id="mapping-file" type="file" accept=".json,application/json" hidden>
  <input id="mapping-all-file" type="file" accept=".json,application/json" hidden>

  <main class="container-fluid px-3 py-3">
    <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
      <button class="btn btn-sm btn-outline-secondary p-1" id="load-sample-button" type="button" aria-label="Load sample data" title="Load sample data"><svg width="18" height="18" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m10 2.5 1.8 5.2 5.2 1.8-5.2 1.8L10 16.5l-1.8-5.2L3 9.5l5.2-1.8L10 2.5Zm5.5 10 .8 1.7 1.7.8-.8 1.7-.8-1.7-1.7-.8 1.7-.8.8-1.7Z"/></svg></button>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary p-1" id="add-level-button" type="button" aria-label="Add target level" title="Add target level"><svg width="18" height="18" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg></button>
        <button class="btn btn-sm btn-outline-secondary p-1" id="import-all-button" type="button" aria-label="Import all mappings" title="Import all mappings"><svg width="18" height="18" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12V3m0 0L7 6m3-3 3 3M4 11v5h12v-5"/></svg></button>
        <button class="btn btn-sm btn-outline-secondary p-1" id="export-all-button" type="button" aria-label="Export all mappings" title="Export all mappings" disabled><svg width="18" height="18" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v9m0 0 3-3m-3 3L7 9M4 14v2h12v-2"/></svg></button>
        <button class="btn btn-sm btn-outline-danger p-1" id="clear-all-button" type="button" aria-label="Clear all schemas and mappings" title="Clear all schemas and mappings" disabled><svg width="18" height="18" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6h11m-9.5 0 .7 10h7.6l.7-10M8 6V4h4v2m-3 3v4m2-4v4"/></svg></button>
      </div>
    </div>

    <section class="d-grid align-items-stretch position-relative pb-2" id="levels-row" aria-label="Schema levels">
      <svg class="d-none position-absolute top-0 start-0 z-2 pe-none" id="connector-layer" aria-hidden="true">
        <defs>
          <marker id="connector-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 7 7"><path d="M0 0 7 3.5 0 7z" fill="#8cab94"/></marker>
          <marker id="connector-arrow-selected" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 7 7"><path d="M0 0 7 3.5 0 7z" fill="#ca7958"/></marker>
        </defs>
      </svg>
      <section class="card shadow-sm" id="e2e-panel" aria-label="Mapping chain across all levels">
        <div class="card-body p-2">
          <div id="e2e-header" class="d-grid align-items-center small text-body-secondary fw-semibold px-0 pb-1" aria-hidden="true"></div>
          <div class="list-group" id="e2e-list"></div>
          <p class="small text-body-secondary text-center my-3" id="e2e-empty">Map fields between adjacent levels to see the full mapping chain here.</p>
        </div>
      </section>
    </section>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"><div class="toast-body" id="toast-message"></div></div>
  </div>
  <div class="modal position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-none align-items-center justify-content-center p-3 overflow-hidden" id="dialog-overlay" aria-hidden="true">
    <section class="modal-content bg-body shadow-lg w-75" id="mapping-export-dialog" role="dialog" aria-modal="true" aria-labelledby="mapping-export-title" hidden>
      <div class="modal-header"><h2 class="modal-title fs-5" id="mapping-export-title">Export mapping</h2><button class="btn-close" id="close-mapping-export" type="button" aria-label="Close"></button></div>
      <div class="modal-body">
        <label class="form-label" for="mapping-export-preview">Mapping JSON</label>
        <textarea class="form-control font-monospace" id="mapping-export-preview" rows="8" readonly spellcheck="false"></textarea>
        <p class="small text-body-secondary mt-2 mb-0" id="mapping-export-status" aria-live="polite"></p>
      </div>
      <div class="modal-footer"><button class="btn btn-outline-secondary" id="cancel-mapping-export" type="button">Cancel</button><button class="btn btn-success" id="download-mapping-export" type="button">Download JSON</button></div>
    </section>
    <section class="modal-dialog modal-dialog-centered w-100" id="confirmation-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmation-title" hidden>
      <div class="modal-content bg-body shadow-lg">
        <div class="modal-header"><h2 class="modal-title fs-5" id="confirmation-title">Confirm action</h2><button class="btn-close" id="cancel-confirmation-close" type="button" aria-label="Close"></button></div>
        <div class="modal-body" id="confirmation-message"></div>
        <div class="modal-footer"><button class="btn btn-outline-secondary" id="cancel-confirmation" type="button">Cancel</button><button class="btn btn-danger" id="accept-confirmation" type="button">Continue</button></div>
      </div>
    </section>
    <section class="modal-dialog modal-dialog-centered w-100" id="sample-dialog" role="dialog" aria-modal="true" aria-labelledby="sample-dialog-title" hidden>
      <div class="modal-content bg-body shadow-lg">
        <div class="modal-header"><h2 class="modal-title fs-5" id="sample-dialog-title">Load sample data</h2><button class="btn-close" id="close-sample-dialog" type="button" aria-label="Close"></button></div>
        <div class="modal-body"><div class="list-group" id="sample-dialog-list"></div></div>
      </div>
    </section>
  </div>
  <template id="tree-group-template">
    <div>
      <button class="btn btn-sm btn-light w-100 text-start d-flex align-items-center gap-2" data-ui="tree-group-label" type="button" aria-expanded="true">
        <span class="text-body-secondary" data-group-chevron aria-hidden="true">⌄</span><span class="font-monospace text-body-secondary" aria-hidden="true">{ }</span>
        <span data-group-name></span><span class="font-monospace small text-body-secondary ms-auto" data-group-type></span>
      </button><div class="ps-3" data-group-children></div>
    </div>
  </template>
  <template id="tree-field-template">
    <button class="list-group-item list-group-item-action py-1 px-2 d-flex align-items-center gap-2" data-ui="tree-field" type="button">
      <span class="font-monospace small text-body-secondary" data-field-glyph aria-hidden="true"></span>
      <span class="small text-truncate" data-field-name></span>
      <span class="text-success ms-auto" data-field-mapped aria-hidden="true" hidden>✓</span>
    </button>
  </template>
  <template id="tree-message-template">
    <div class="text-center text-body-secondary small p-3"><span data-tree-message></span>
      <button class="btn btn-sm btn-outline-success d-block mx-auto mt-2" type="button" data-import-side></button>
    </div>
  </template>
  <template id="mapping-row-template">
    <article class="list-group-item" data-mapping-id>
      <div class="d-grid align-items-start gap-2" data-mapping-row>
        <div><span class="d-block small text-truncate fw-semibold" data-source-name></span><span class="d-block small font-monospace text-body-secondary text-truncate" data-source-path></span></div>
        <span class="text-body-secondary align-self-start text-start lh-sm" aria-hidden="true">→</span>
        <div><span class="d-block small text-truncate fw-semibold" data-target-name></span><span class="d-block small font-monospace text-body-secondary text-truncate" data-target-path></span></div>
        <div><button class="btn btn-sm btn-outline-secondary p-1" type="button" data-remove-id title="Remove mapping"><span class="visually-hidden" data-remove-label></span><svg width="16" height="16" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
      </div>
    </article>
  </template>
  <template id="level-panel-template">
    <section aria-label="Schema level">
      <div class="card shadow-sm h-100">
        <div class="card-header bg-white d-flex align-items-center justify-content-between gap-2">
          <div class="d-flex align-items-center gap-2 text-truncate">
            <span data-level-icon aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5.5h14v13H5zM8.5 9h7M8.5 12h7M8.5 15h4"/></svg></span>
            <div class="text-truncate"><h2 class="h6 mb-1" data-level-title></h2><p class="small text-body-secondary mb-0 text-truncate" data-level-schema-name></p></div>
          </div>
          <div class="d-flex gap-1 flex-shrink-0">
            <button class="btn btn-sm btn-outline-secondary p-1" data-import-schema type="button"><svg width="18" height="18" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12V3m0 0L7 6m3-3 3 3M4 11v5h12v-5"/></svg></button>
            <button class="btn btn-sm btn-outline-secondary p-1" data-clear-schema type="button" disabled><svg width="18" height="18" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6h11m-9.5 0 .7 10h7.6l.7-10M8 6V4h4v2m-3 3v4m2-4v4"/></svg></button>
            <button class="btn btn-sm btn-outline-danger p-1" data-remove-level type="button" hidden><svg width="18" height="18" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
          </div>
        </div>
        <div class="card-body p-2 d-flex flex-column">
          <div class="d-flex justify-content-between align-items-center px-2 py-1 small text-body-secondary"><span class="font-monospace"><span aria-hidden="true">{ }</span> <span data-level-root>Not loaded</span></span><span data-level-field-count></span></div>
          <label class="input-group input-group-sm my-2"><span class="input-group-text" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8.8" cy="8.8" r="5.3"/><path d="m13 13 3.5 3.5"/></svg></span><input class="form-control" data-level-search type="search" placeholder="Find a field" autocomplete="off" aria-label="Search fields"></label>
          <div class="list-group list-group-flush overflow-auto flex-grow-1" data-level-tree aria-label="Fields"></div>
        </div>
      </div>
    </section>
  </template>
  <template id="mapping-card-template">
    <section aria-label="Mapping link">
      <div class="card shadow-sm h-100">
        <div class="card-body p-2 d-flex flex-column">
          <div class="d-grid align-items-center gap-1 small text-body-secondary fw-semibold px-1 py-1 border-bottom" data-mapping-row data-link-header>
            <span class="text-truncate" data-link-source-header></span><span></span><span class="text-truncate" data-link-target-header></span>
            <div class="d-flex align-items-center justify-content-end gap-1">
              <button class="btn btn-sm btn-outline-success p-1" data-insert-level type="button" aria-label="Insert target level" title="Insert target level"><svg width="18" height="18" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg></button>
              <button class="btn btn-sm btn-outline-secondary p-1" data-link-import type="button" aria-label="Import mapping" title="Import mapping"><svg width="18" height="18" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12V3m0 0L7 6m3-3 3 3M4 11v5h12v-5"/></svg></button>
              <button class="btn btn-sm btn-outline-secondary p-1" data-link-export type="button" aria-label="Export mapping" title="Export mapping" disabled><svg width="18" height="18" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v9m0 0 3-3m-3 3L7 9M4 14v2h12v-2"/></svg></button>
              <button class="btn btn-sm btn-outline-danger p-1" data-link-clear type="button" aria-label="Clear mappings" title="Clear mappings" disabled><svg width="18" height="18" aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6h11m-9.5 0 .7 10h7.6l.7-10M8 6V4h4v2m-3 3v4m2-4v4"/></svg></button>
            </div>
          </div>
          <div class="list-group overflow-auto flex-grow-1" data-link-list></div>
          <div class="text-center py-4" data-link-empty>
            <div class="d-flex align-items-center justify-content-center gap-3 mb-2 text-body-tertiary" aria-hidden="true"><span class="border rounded p-2">{ }</span><span>→</span><span class="border rounded p-2">{ }</span></div>
            <p class="small text-body-secondary mx-auto my-2" data-link-empty-copy>Import schemas on both sides first.</p>
          </div>
        </div>
      </div>
    </section>
  </template>
</body>
</html>
